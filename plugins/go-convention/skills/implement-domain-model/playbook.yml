version: 2
name: implement-domain-model
description: implement-domain-modelの仕事を同じagentが宣言順に完了する。
inputs: [request]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: map-source-to-code
    agent_work: invoking_agent
    purpose: "資料を読み、対応表を作る"
  - id: implement-value-objects
    agent_work: invoking_agent
    purpose: "値オブジェクトを書く"
  - id: implement-aggregate
    agent_work: invoking_agent
    purpose: "集約を書く"
  - id: implement-sentinels-and-events
    agent_work: invoking_agent
    purpose: "sentinel とイベントを書く"
  - id: implement-filter-restore-port
    agent_work: invoking_agent
    purpose: "絞り込み・復元・永続化ポートを書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
