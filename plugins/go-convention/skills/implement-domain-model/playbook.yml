version: 2
name: implement-domain-model
description: implement-domain-modelの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: read-model-and-decide-mapping
    agent_work: invoking_agent
    purpose: "資料を読み、対応を決める"
  - id: implement-value-objects
    agent_work: invoking_agent
    purpose: "値オブジェクトを書く"
  - id: implement-aggregate
    agent_work: invoking_agent
    purpose: "集約を書く"
  - id: implement-errors-and-events
    agent_work: invoking_agent
    purpose: "エラーとイベントを書く"
  - id: implement-repository-port
    agent_work: invoking_agent
    purpose: "永続化ポートを書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
