version: 2
name: handle-errors
description: handle-errorsの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: collect-grounds
    agent_work: invoking_agent
    purpose: "根拠を集める"
  - id: classify-and-define
    agent_work: invoking_agent
    purpose: "分類を選んで定義する"
  - id: normalize-propagation
    agent_work: invoking_agent
    purpose: "運び方を揃える"
  - id: place-translation-and-reclassification
    agent_work: invoking_agent
    purpose: "翻訳と付け替えを置く"
  - id: check-boundary-tables
    agent_work: invoking_agent
    purpose: "境界の表を確かめる"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
