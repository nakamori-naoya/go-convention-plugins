version: 2
name: write-logs
description: write-logsの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: inspect-boundaries
    agent_work: invoking_agent
    purpose: "境界を確かめる"
  - id: choose-lines-to-record
    agent_work: invoking_agent
    purpose: "記録する行を選ぶ"
  - id: decide-level-from-table
    agent_work: invoking_agent
    purpose: "レベルを表から決める"
  - id: decide-message-and-attributes
    agent_work: invoking_agent
    purpose: "メッセージと属性を決める"
  - id: inspect-logger-injection
    agent_work: invoking_agent
    purpose: "logger の渡し方を確かめる"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
