version: 2
name: write-logs
description: write-logsの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: inspect-boundary
    agent_work: invoking_agent
    purpose: "境界を確かめる"
  - id: decide-if-boundary-receives-event
    agent_work: invoking_agent
    purpose: "出したい行が境界へ返るかを問う"
  - id: inspect-layer
    agent_work: invoking_agent
    purpose: "層を確かめる"
  - id: decide-level-message-attributes
    agent_work: invoking_agent
    purpose: "レベルと `msg` と属性を決める"
  - id: inspect-secrecy
    agent_work: invoking_agent
    purpose: "秘匿を確かめる"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械で見られる分を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
