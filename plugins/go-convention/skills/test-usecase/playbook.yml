version: 2
name: test-usecase
description: test-usecaseの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: classify-five-concerns
    agent_work: invoking_agent
    purpose: "usecase の `Execute` を読み、5 観点に分ける"
  - id: decide-cases
    agent_work: invoking_agent
    purpose: "ケースを決める"
  - id: inspect-test-main
    agent_work: invoking_agent
    purpose: "`main_test.go` を確かめる"
  - id: write-table-and-loop
    agent_work: invoking_agent
    purpose: "表とループ本体を書く"
  - id: return-missing-test-support
    agent_work: invoking_agent
    purpose: "足りないテスト支援を返す"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
