version: 2
name: test-repository
description: test-repositoryの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: align-docs-and-target
    agent_work: invoking_agent
    purpose: "資料と対象を揃える"
  - id: assign-bdd
    agent_work: invoking_agent
    purpose: "BDD を割り振る"
  - id: prepare-database-and-test-sql
    agent_work: invoking_agent
    purpose: "実 DB とテスト専用の SQL を用意する"
  - id: write-table
    agent_work: invoking_agent
    purpose: "表を書く"
  - id: write-loop
    agent_work: invoking_agent
    purpose: "ループ本体を書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
