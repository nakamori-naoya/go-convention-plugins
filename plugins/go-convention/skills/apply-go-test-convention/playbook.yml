version: 2
name: apply-go-test-convention
description: apply-go-test-conventionの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: choose-target
    agent_work: invoking_agent
    purpose: "対象を1つに決める"
  - id: choose-table-shape
    agent_work: invoking_agent
    purpose: "テーブルの型を決める"
  - id: write-cases
    agent_work: invoking_agent
    purpose: "ケースを書く"
  - id: write-single-loop
    agent_work: invoking_agent
    purpose: "ループ本体を1回書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
