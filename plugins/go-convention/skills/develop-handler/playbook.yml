# develop-handler — handler層の1単位（Connect-RPCのRPC 1つ）を、
# テスト → 赤 → 実装 → 緑 → 整える、の順で完成させる合成入口。
# skill: は同packageの公開入口を宣言順に呼ぶ。呼ばれる入口のSKILL.mdとfileは変えない。
version: 2
name: develop-handler
description: handler層の1単位をTDDの1サイクル（テスト→赤→実装→緑→整える）で同じagentが完成させる。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する。run-redの失敗は赤の観測であり停止ではない
requires: []
steps:
  - id: fix-unit
    agent_work: invoking_agent
    purpose: "単位を固定する（RPC、usecase、公開結果の一覧、テストfileと実装file、開始時のテスト結果）"
    needs: [request]
    provides: [unit]
  - id: write-failing-test
    skill: test-handler
    purpose: "handlerのテストの規約を、テストが先の場面として適用し、公開結果ごとのAPIテストを書く"
    needs: [unit]
    provides: [test_file]
  - id: run-red
    agent_work: invoking_agent
    purpose: "赤を確かめる（対象未実装または期待と一致しない、以外の失敗が無い）"
    needs: [unit, test_file]
    provides: [red_reason]
  - id: implement
    skill: implement-handler
    purpose: "handlerの実装の規約で、テストが緑になる最小の実装を書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation]
  - id: run-green
    agent_work: invoking_agent
    purpose: "緑を確かめる（対象のテスト、同じpackageの全テスト、テストの規約の機械検査）"
    needs: [unit, test_file, implementation]
    provides: [green]
  - id: refactor
    skill: write-go-code
    purpose: "言語規約で整える。振る舞いを変えず、テストは触らない"
    needs: [implementation, green]
    provides: [refactored]
  - id: align-errors
    skill: handle-errors
    when: implementation.touched_code_table
    purpose: "この単位で対応表の行や公開文言を足した・変えたときだけ、エラーの規約で境界1か所の対応表に揃える"
    needs: [implementation, refactored]
    provides: [errors_aligned]
  - id: align-logs
    skill: write-logs
    when: implementation.touched_logging
    purpose: "この単位でinterceptorやログの出力を足した・変えたときだけ、ログの規約で最外境界1回の形に揃える"
    needs: [implementation, refactored]
    provides: [logs_aligned]
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
    needs: [unit, red_reason, green, refactored]
    conditional_needs:
      - when: implementation.touched_code_table
        needs: [errors_aligned]
      - when: implementation.touched_logging
        needs: [logs_aligned]
