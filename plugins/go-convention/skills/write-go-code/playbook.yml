version: 2
name: write-go-code
description: write-go-codeの仕事を同じagentが宣言順に完了する。
inputs: [request]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: decide-target-and-layer
    agent_work: invoking_agent
    purpose: "対象と層を決める"
  - id: inspect-module-and-tools
    agent_work: invoking_agent
    purpose: "`go.mod` とツールを確かめる"
  - id: normalize-functions
    agent_work: invoking_agent
    purpose: "関数の形を揃える"
  - id: normalize-types-and-interfaces
    agent_work: invoking_agent
    purpose: "型と interface を揃える"
  - id: normalize-names
    agent_work: invoking_agent
    purpose: "名前を揃える"
  - id: adopt-standard-library
    agent_work: invoking_agent
    purpose: "標準ライブラリに置き換える"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
