version: 2
name: test-domain-model
description: test-domain-modelの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: align-docs-and-target
    agent_work: invoking_agent
    purpose: "資料と対象を揃える"
  - id: assign-bdd
    agent_work: invoking_agent
    purpose: "BDD を割り振る"
  - id: write-tables
    agent_work: invoking_agent
    purpose: "テスト関数ごとに表を書く"
  - id: write-single-loop
    agent_work: invoking_agent
    purpose: "ループ本体を一回書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
