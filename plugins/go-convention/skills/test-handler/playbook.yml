version: 2
name: test-handler
description: test-handlerの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: choose-rpc
    agent_work: invoking_agent
    purpose: "対象の RPC を 1 つ決める"
  - id: inspect-composition-seam
    agent_work: invoking_agent
    purpose: "組み立て関数と差し替え点を確かめる"
  - id: prepare-test-main
    agent_work: invoking_agent
    purpose: "`main_test.go` を置く（無ければ）"
  - id: select-cases
    agent_work: invoking_agent
    purpose: "ケースを選ぶ"
  - id: write-table-and-loop
    agent_work: invoking_agent
    purpose: "表とループ本体を書く"
  - id: verify
    agent_work: invoking_agent
    purpose: "検証する"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
