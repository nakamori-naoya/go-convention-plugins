version: 2
name: test-handler
description: test-handlerの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: confirm-startup
    agent_work: invoking_agent
    purpose: "起動を確かめる"
  - id: choose-cases
    agent_work: invoking_agent
    purpose: "ケースを選ぶ"
  - id: write-table
    agent_work: invoking_agent
    purpose: "表を書く"
  - id: write-loop
    agent_work: invoking_agent
    purpose: "ループ本体を書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
