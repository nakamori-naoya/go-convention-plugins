version: 2
name: implement-usecase
description: implement-usecaseの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: confirm-pattern
    agent_work: invoking_agent
    purpose: "形を確かめる"
  - id: decide-input-output
    agent_work: invoking_agent
    purpose: "入力と出力を決める"
  - id: list-dependencies
    agent_work: invoking_agent
    purpose: "依存を並べる"
  - id: decide-transaction
    agent_work: invoking_agent
    purpose: "トランザクションを決める"
  - id: write-execute
    agent_work: invoking_agent
    purpose: "`Execute` を書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
