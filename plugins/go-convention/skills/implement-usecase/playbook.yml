version: 2
name: implement-usecase
description: implement-usecaseの仕事を同じagentが宣言順に完了する。
inputs: [request]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: split-usecase
    agent_work: invoking_agent
    purpose: "usecase を切る"
  - id: decide-io-id-time-ownership
    agent_work: invoking_agent
    purpose: "Input / Output と、ID・時刻の持ち主を決める"
  - id: order-dependencies
    agent_work: invoking_agent
    purpose: "依存を並べる"
  - id: decide-aggregate-coordination
    agent_work: invoking_agent
    purpose: "集約の協調を決める"
  - id: write-execute
    agent_work: invoking_agent
    purpose: "`Execute` を書く"
  - id: compile
    agent_work: invoking_agent
    purpose: "コンパイルを通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
