version: 2
name: implement-handler
description: implement-handlerの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: decide-entrance
    agent_work: invoking_agent
    purpose: "入口の形を決める"
  - id: write-conversion
    agent_work: invoking_agent
    purpose: "変換を書く"
  - id: write-entrance
    agent_work: invoking_agent
    purpose: "入口を書く"
  - id: inspect-interceptors-and-policies
    agent_work: invoking_agent
    purpose: "interceptor と方針の表を確かめる"
  - id: wire
    agent_work: invoking_agent
    purpose: "組み立てに足す"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
