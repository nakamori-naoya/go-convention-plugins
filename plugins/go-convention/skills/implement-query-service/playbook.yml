version: 2
name: implement-query-service
description: implement-query-serviceの仕事を同じagentが宣言順に完了する。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する
requires: []
steps:
  - id: inspect-contract-and-ledger
    agent_work: invoking_agent
    purpose: "契約と台帳を確かめる"
  - id: write-sql
    agent_work: invoking_agent
    purpose: "SQL を書く"
  - id: assemble-read-model
    agent_work: invoking_agent
    purpose: "読み取りモデルを組み立てる"
  - id: implement-query-type
    agent_work: invoking_agent
    purpose: "Query の型を書く"
  - id: run-structural-checks
    agent_work: invoking_agent
    purpose: "機械検査を通す"
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
