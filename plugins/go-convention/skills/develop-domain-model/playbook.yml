# develop-domain-model — ドメイン層の1単位を、テスト → 赤 → 実装 → 緑 → 整える、の順で完成させる合成入口。
# skill: は同packageの公開入口を宣言順に呼ぶ。呼ばれる入口のSKILL.mdとfileは変えない。
# テストfile（*_test.go）と実装fileは分かれたままで、工程だけが交互に辿る。
version: 2
name: develop-domain-model
description: ドメイン層の1単位をTDDの1サイクル（テスト→赤→実装→緑→整える）で同じagentが完成させる。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する。run-redの失敗は赤の観測であり停止ではない
requires: []
steps:
  - id: fix-unit
    agent_work: invoking_agent
    purpose: "単位を固定する（要素、BDD、テストfileと実装file、開始時のテスト結果）"
    needs: [request]
    provides: [unit]
  - id: write-failing-test
    skill: test-domain-model
    purpose: "ドメインのテストの規約を、テストが先の場面として適用し、この単位のBDDをテストへ写す"
    needs: [unit]
    provides: [test_file]
  - id: run-red
    agent_work: invoking_agent
    purpose: "赤を確かめる（対象未実装または資料の結果を返さない、以外の失敗が無い）"
    needs: [unit, test_file]
    provides: [red_reason]
  - id: implement
    skill: implement-domain-model
    purpose: "ドメインの実装の規約で、テストが緑になる最小の実装を書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation]
  - id: run-green
    agent_work: invoking_agent
    purpose: "緑を確かめる（対象のテスト、同じpackageの全テスト、テストの規約の機械検査）"
    needs: [unit, test_file, implementation]
    provides: [green]
  - id: refactor
    skill: write-go-code
    purpose: "言語規約で整える。振る舞いを変えず、テストは触らない"
    needs: [implementation, green]
    provides: [refactored]
  - id: align-errors
    skill: handle-errors
    when: implementation.touched_sentinels
    purpose: "この単位でsentinelを足した・文言を変えたときだけ、エラーの規約で資料と1:1に揃える"
    needs: [implementation, refactored]
    provides: [errors_aligned]
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
    needs: [unit, red_reason, green, refactored]
    conditional_needs:
      - when: implementation.touched_sentinels
        needs: [errors_aligned]
