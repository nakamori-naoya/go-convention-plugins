# develop-go-unit — Go の1単位を、テスト → 赤 → 実装 → 緑 → 整える、の順で完成させる合成入口。
# 層は fix-unit が決めた unit.layer で、テストと実装の工程をそれぞれ一つだけ実行する。
# skill: は同packageの公開入口を宣言順に呼ぶ。呼ばれる入口のSKILL.mdとfileは変えない。
version: 2
name: develop-go-unit
description: Go の1単位をTDDの1サイクル（テスト→赤→実装→緑→整える）で同じagentが完成させる。
inputs: [request, references]
instructions:
  execution:
    directive: 同じagentがstepsを上から順に実行し、失敗した工程を成功扱いせず停止する。run-redの失敗は赤の観測であり停止ではない
requires: []
steps:
  - id: fix-unit
    agent_work: invoking_agent
    purpose: "単位を固定する（層、対象、主に担うBDD、テストfileと実装file、開始時のテスト結果）"
    needs: [request]
    provides: [unit]
  - id: write-failing-test-domain-model
    skill: test-domain-model
    when: unit.layer == domain_model
    purpose: "ドメイン（集約一つか値オブジェクト一つ）のテストを、テストが先の場面として書く"
    needs: [unit]
    provides: [test_file_domain_model]
  - id: write-failing-test-repository
    skill: test-repository
    when: unit.layer == repository
    purpose: "リポジトリか手順の口のテストを、テストが先の場面として書く"
    needs: [unit]
    provides: [test_file_repository]
  - id: write-failing-test-query-service
    skill: test-repository
    when: unit.layer == query_service
    purpose: "Query の実装のテストを、テストが先の場面として書く"
    needs: [unit]
    provides: [test_file_query_service]
  - id: write-failing-test-usecase
    skill: test-usecase
    when: unit.layer == usecase
    purpose: "usecase（command、手順、query）のテストを、テストが先の場面として書く"
    needs: [unit]
    provides: [test_file_usecase]
  - id: write-failing-test-handler
    skill: test-handler
    when: unit.layer == handler
    purpose: "入口（RPC、受信境界、巡回）のテストを、テストが先の場面として書く"
    needs: [unit]
    provides: [test_file_handler]
  - id: run-red
    agent_work: invoking_agent
    purpose: "赤を確かめる（対象未実装または期待と一致しない、以外の失敗が無い）"
    needs: [unit]
    conditional_needs:
      - when: unit.layer == domain_model
        needs: [test_file_domain_model]
      - when: unit.layer == repository
        needs: [test_file_repository]
      - when: unit.layer == query_service
        needs: [test_file_query_service]
      - when: unit.layer == usecase
        needs: [test_file_usecase]
      - when: unit.layer == handler
        needs: [test_file_handler]
    provides: [red_reason]
  - id: implement-domain-model
    skill: implement-domain-model
    when: unit.layer == domain_model
    purpose: "ドメイン（集約一つか値オブジェクト一つ）を、テストが緑になる最小の形で書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation_domain_model]
  - id: implement-repository
    skill: implement-repository
    when: unit.layer == repository
    purpose: "リポジトリか手順の口を、テストが緑になる最小の形で書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation_repository]
  - id: implement-query-service
    skill: implement-query-service
    when: unit.layer == query_service
    purpose: "Query の実装を、テストが緑になる最小の形で書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation_query_service]
  - id: implement-usecase
    skill: implement-usecase
    when: unit.layer == usecase
    purpose: "usecase（command、手順、query）を、テストが緑になる最小の形で書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation_usecase]
  - id: implement-handler
    skill: implement-handler
    when: unit.layer == handler
    purpose: "入口（RPC、受信境界、巡回）を、テストが緑になる最小の形で書く。テストは触らない"
    needs: [unit, red_reason]
    provides: [implementation_handler]
  - id: run-green
    agent_work: invoking_agent
    purpose: "緑を確かめる（対象のテスト、同じpackageの全テスト、テストの規約の機械検査）"
    needs: [unit, red_reason]
    conditional_needs:
      - when: unit.layer == domain_model
        needs: [test_file_domain_model, implementation_domain_model]
      - when: unit.layer == repository
        needs: [test_file_repository, implementation_repository]
      - when: unit.layer == query_service
        needs: [test_file_query_service, implementation_query_service]
      - when: unit.layer == usecase
        needs: [test_file_usecase, implementation_usecase]
      - when: unit.layer == handler
        needs: [test_file_handler, implementation_handler]
    provides: [green]
  - id: refactor
    skill: write-go-code
    purpose: "言語規約で整える。振る舞いを変えず、テストは触らない"
    needs: [unit, green]
    provides: [refactored]
  - id: align-errors
    skill: handle-errors
    when: unit.touched_errors
    purpose: "この単位で具体エラー、翻訳、境界の表を足した・変えたときだけ、エラーの規約で揃える"
    needs: [unit, refactored]
    provides: [errors_aligned]
  - id: align-logs
    skill: write-logs
    when: unit.touched_logging
    purpose: "この単位で記録の場所やレベルを足した・変えたときだけ、ログの規約で揃える"
    needs: [unit, refactored]
    provides: [logs_aligned]
  - id: report
    agent_work: invoking_agent
    purpose: "報告する"
    needs: [unit, red_reason, green, refactored]
    conditional_needs:
      - when: unit.touched_errors
        needs: [errors_aligned]
      - when: unit.touched_logging
        needs: [logs_aligned]
